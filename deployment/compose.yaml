name: plataforma-analitica
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest@sha256:4525e3efac9f3e241cb003bb2ff2a82818b502f37e12049d788b1a9fa7e13b7f
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Define MSSQL_SA_PASSWORD en .env}
      MSSQL_MEMORY_LIMIT_MB: '4096'
    ports:
      - '127.0.0.1:14333:1433'
    mem_limit: 6g
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ../data/backups:/backups:ro
    healthcheck:
      test: ['CMD-SHELL', '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    restart: unless-stopped
volumes:
  sqlserver_data:
